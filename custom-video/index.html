<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Merriweather&display=swap"
      rel="stylesheet"
    />
    <title>Custom video</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header>
      <div class="left_line"></div>
      <div class="title">
        <h1>Video</h1>
      </div>
      <div class="right_line"></div>
    </header>
    <div class="main">
      <div class="wrapper">
        <div class="screen">
          <video src="./assets/video/video.mp4"></video>
          <button class="play_button_on_screen"></button>
          <div class="controls">
            <button class="play_button"></button>
            <input class="video_progress" type="range" max="100" value="0" />
            <button class="mute_button" type="button" value=""></button>
            <input
              class="sound_range"
              type="range"
              min="0"
              max="100"
              value="30"
            />
          </div>
        </div>
        <button class="theme_button"></button>
      </div>
      <footer>
        <div class="footer_container">
          <div class="footer_data">
            <span>©</span><a href="https://github.com/Alitalia60">github</a>
          </div>
          <div class="footer_year">
            <span>2022</span>
          </div>
          <div class="footer_rsschool">
            <a href="rsschool.com" class="rss"> Rolling Scopes School </a>
          </div>
        </div>
      </footer>
    </div>
    <script src="./index.js"></script>
  </body>
</html>
