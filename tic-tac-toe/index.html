<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tic-tak-toe</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="./assets/img/favicon.ico" type="image/x-icon">
</head>

<body>
    <header>
        <h3>tic-tak-toe</h3>
        <div class="controls">
            <div class="controls_music">
                <div class="switch music_mute">
                    <div class="point"></div>
                </div>
                <span>music</span>
            </div>
            <div class="controls_sound">
                <div class="switch sound_mute">
                    <div class="point "></div>
                </div>
                <span>sound</span>
            </div>
        </div>
    </header>
    <main>
        <ul class="score_table info_table">
            <li class="score_game">
                <span>Game:</span> <span></span>
            </li>
            <li class="score_step">
                <span>Step:</span> <span></span>
            </li>
            <li class="score_draw"><span>Draw</span></li>
            <li class="score_x_wins">
                <span>X wins:</span> <span></span>
            </li>
            <li class="score_o_wins">
                <span>O wins:</span> <span></span>
            </li>
        </ul>
        <div id="field">
            <div class="cell" id="a1"></div>
            <div class="cell" id="a2"></div>
            <div class="cell" id="a3"></div>
            <div class="cell" id="b1"></div>
            <div class="cell" id="b2"></div>
            <div class="cell" id="b3"></div>
            <div class="cell" id="c1"></div>
            <div class="cell" id="c2"></div>
            <div class="cell" id="c3"></div>
        </div>
        <div class="history_table info_table">
            <table class="score_table">
                <caption>history</caption>
                <th id="th-x">X</th>
                <th id="th-o">O</th>
                <th id="th-d">D</th>
                <tr id="r9-current">
                    <td id="td-r9-x"></td>
                    <td id="td-r9-o"></td>
                    <td id="td-r9-d"></td>
                </tr>
                <tr id="r8">
                    <td id="td-r8-x"></td>
                    <td id="td-r8-o"></td>
                    <td id="td-r8-d"></td>
                </tr>
                <tr id="r7">
                    <td id="td-r7-x"></td>
                    <td id="td-r7-o"></td>
                    <td id="td-r7-d"></td>
                </tr>
                <tr id="r6">
                    <td id="td-r6-x"></td>
                    <td id="td-r6-o"></td>
                    <td id="td-r6-d"></td>
                </tr>
                <tr id="r5">
                    <td id="td-r5-x"></td>
                    <td id="td-r5-o"></td>
                    <td id="td-r5-d"></td>
                </tr>
                <tr id="r4">
                    <td id="td-r4-x"></td>
                    <td id="td-r4-o"></td>
                    <td id="td-r4-d"></td>
                </tr>
                <tr id="r3">
                    <td id="td-r3-x"></td>
                    <td id="td-r3-o"></td>
                    <td id="td-r3-d"></td>
                </tr>
                <tr id="r2">
                    <td id="td-r2-x"></td>
                    <td id="td-r2-o"></td>
                    <td id="td-r2-d"></td>
                </tr>
                <tr id="r1">
                    <td id="td-r1-x"></td>
                    <td id="td-r1-o"></td>
                    <td id="td-r1-d"></td>
                </tr>
                <tr id="r0">
                    <td id="td-r0-x"></td>
                    <td id="td-r0-o"></td>
                    <td id="td-r0-d"></td>
                </tr>
            </table>
            <button id="clear_history">Clear</button>
        </div>

        <div class="game_over_box">
            <h1 class="game_status status_line_1">READY</h1>
            <h1 class="game_status status_line_2">READY</h1>
            <button class="btn_start_game">PRESS TO START</button>
        </div>
    </main>
    <footer>
        <div class="footer_container">
            <div class="footer_data">
                <span>© </span><a href="https://github.com/Alitalia60">github</a>
            </div>
            <div class="footer_year">
                <span>2022</span>
            </div>
            <div class="footer_rsschool">
                <a href="https://rs.school/" class="rss"> <img src="./assets/img/rss.svg" alt="rs.school" width="133" height="67"> </a>
            </div>
        </div>
    </footer>
    <script src="script.js"></script>
</body>

</html>
