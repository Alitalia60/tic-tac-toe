<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tic-tak-toe</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h3>tic-tak-toe</h3>
        <div class="controls">
            <div class="controls_music">
                <div class="switch music_mute">
                    <div class="point"></div>
                </div>
                <span>music</span>
            </div>
            <div class="controls_sound">
                <div class="switch sound_mute">
                    <div class="point "></div>
                </div>
                <span>sound</span>
            </div>
        </div>
    </header>
    <main>
        <div class="score">
            <ul class="score_table">
                <li class="score_step">
                    <span>Moves:</span> <span></span>
                </li>
                <li class=""></li>
                <li class="score_x_wins">
                    <span>X wins:</span> <span></span>
                </li>
                <li class="score_o_wins">
                    <span>O wins:</span> <span></span>
                </li>
            </ul>
        </div>
        <div id="field">
            <div class="cell" id="a1"></div>
            <div class="cell" id="a2"></div>
            <div class="cell" id="a3"></div>
            <div class="cell" id="b1"></div>
            <div class="cell" id="b2"></div>
            <div class="cell" id="b3"></div>
            <div class="cell" id="c1"></div>
            <div class="cell" id="c2"></div>
            <div class="cell" id="c3"></div>
        </div>
        <div class="game_over_box">
            <h1 class="game_status">READY</h1>
            <button class="btn_start_game">PRESS TO START</button>
        </div>
    </main>
    <footer>
        <div class="footer_container">
            <div class="footer_data">
                <span>© </span><a href="https://github.com/Alitalia60">github</a>
            </div>
            <div class="footer_year">
                <span>2022</span>
            </div>
            <div class="footer_rsschool">
                <a href="https://rs.school/" class="rss"> <img src="./assets/img/rss.svg" alt="rs.school" width="133" height="67"> </a>
            </div>
        </div>
    </footer>
    <script src="script.js"></script>
</body>

</html>
